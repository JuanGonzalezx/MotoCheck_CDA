<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="1400" height="820" fill="#fff"/>
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2a44">Máquina de estados del controlador (por cada estación k = 1…4)</text>
  <g font-size="18" text-anchor="middle">
    <rect x="80" y="90" width="230" height="80" rx="40" fill="#edf2f7" stroke="#4a5568" stroke-width="2.5"/><text x="195" y="125" font-weight="bold">CALENTANDO</text><text x="195" y="150" font-size="15">MQ-2: 60 s</text>
    <rect x="420" y="90" width="230" height="80" rx="40" fill="#edf2f7" stroke="#4a5568" stroke-width="2.5"/><text x="535" y="125" font-weight="bold">ESPERA</text><text x="535" y="150" font-size="15">espera START;placa</text>
    <rect x="760" y="90" width="270" height="80" rx="12" fill="#fff" stroke="#4a5568" stroke-width="2"/><text x="895" y="122" font-weight="bold">Líneas base</text><text x="895" y="148" font-size="15">luz ambiente y gas en aire limpio</text>

    <rect x="760" y="250" width="270" height="80" rx="40" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2.5"/><text x="895" y="285" font-weight="bold">AVANZANDO</text><text x="895" y="310" font-size="15">banda ON hasta que IRk = LOW</text>
    <rect x="760" y="400" width="270" height="80" rx="40" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2.5"/><text x="895" y="435" font-weight="bold">DESPLEGANDO</text><text x="895" y="460" font-size="15">banda OFF · servo k a 90°</text>
    <rect x="760" y="550" width="270" height="80" rx="40" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2.5"/><text x="895" y="585" font-weight="bold">MIDIENDO</text><text x="895" y="610" font-size="15">muestreo · evaluación · LED k</text>
    <rect x="420" y="550" width="230" height="80" rx="40" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2.5"/><text x="535" y="585" font-weight="bold">RETIRANDO</text><text x="535" y="610" font-size="15">servo k a 0°</text>
    <rect x="80" y="550" width="230" height="80" rx="40" fill="#eaf7ee" stroke="#2f855a" stroke-width="2.5"/><text x="195" y="585" font-weight="bold">SALIENDO</text><text x="195" y="610" font-size="15">banda ON 3 s</text>
    <rect x="80" y="700" width="230" height="80" rx="40" fill="#eaf7ee" stroke="#2f855a" stroke-width="2.5"/><text x="195" y="735" font-weight="bold">FIN</text><text x="195" y="760" font-size="15">JSON "fin" · buzzer 1 o 3</text>
    <rect x="1120" y="400" width="230" height="80" rx="40" fill="#fff5f5" stroke="#c53030" stroke-width="2.5"/><text x="1235" y="435" font-weight="bold" fill="#c53030">ERROR</text><text x="1235" y="460" font-size="15">todo OFF · LEDs rojos</text>
  </g>
  <g stroke="#333" stroke-width="2.5" fill="none">
    <line x1="312" y1="130" x2="416" y2="130" marker-end="url(#a)"/>
    <line x1="652" y1="130" x2="756" y2="130" marker-end="url(#a)"/>
    <line x1="895" y1="172" x2="895" y2="246" marker-end="url(#a)"/>
    <line x1="895" y1="332" x2="895" y2="396" marker-end="url(#a)"/>
    <line x1="895" y1="482" x2="895" y2="546" marker-end="url(#a)"/>
    <line x1="756" y1="590" x2="654" y2="590" marker-end="url(#a)"/>
    <path d="M535,548 L535,290 L756,290" marker-end="url(#a)"/>
    <line x1="416" y1="590" x2="314" y2="590" marker-end="url(#a)"/>
    <line x1="195" y1="632" x2="195" y2="696" marker-end="url(#a)"/>
    <path d="M1032,290 L1235,290 L1235,396" marker-end="url(#a)" stroke="#c53030"/>
  </g>
  <g font-size="15" fill="#1a202c">
    <text x="330" y="118">60 s</text>
    <text x="664" y="118">START</text>
    <text x="905" y="370">IRk detecta moto</text>
    <text x="905" y="520">700 ms</text>
    <text x="662" y="578">fin de medida</text>
    <text x="545" y="420">k &lt; 4: k = k + 1</text>
    <text x="330" y="578">k = 4</text>
    <text x="205" y="672">3 s</text>
    <text x="1060" y="280" fill="#c53030">timeout 15 s</text>
    <text x="340" y="745" fill="#555">FIN / ERROR → ESPERA con nuevo START · STOP en cualquier estado</text>
  </g>
  <g font-size="15" fill="#4a5568">
    <text x="80" y="230">Medida por estación:</text>
    <text x="80" y="256">k=1 Faro: 1,5 s · promedio LDR − ambiente ≥ umbral</text>
    <text x="80" y="280">k=2 Temp: 6 s · Tmin ≤ T ≤ Tmax</text>
    <text x="80" y="304">k=3 Gases: 4 s · lectura / base ≤ máx</text>
    <text x="80" y="328">k=4 Rueda: rodillo 3 s → RPM y CV;</text>
    <text x="80" y="352">       apagado → tiempo de inercia</text>
  </g>
</svg>
